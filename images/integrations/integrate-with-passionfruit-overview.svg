<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" font-family="Inter, -apple-system, Segoe UI, sans-serif">
  <title>How Passionfruit works with your systems</title>
  <desc>The agent uses Passionfruit's organization map and document library. An intelligent integration layer learns where and how to fetch information from your systems: the integration library and custom integrations are read live, documents from your DMS are synced.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>
    .h { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
    .s { font-size: 12px; fill: #5F5E5A; }
    .card { fill: #FFFFFF; stroke: #D3D1C7; stroke-width: 0.5; }
  </style>
  <g text-anchor="middle" dominant-baseline="central">
    <rect x="280" y="30" width="120" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text class="h" x="340" y="49" style="fill:#712B13">Agent</text>
    <text class="s" x="340" y="69" style="fill:#993C1D">Does the task</text>

    <rect x="40" y="110" width="600" height="240" rx="20" fill="#EEEDFE"/>
    <text class="h" x="340" y="134" style="fill:#3C3489">Passionfruit</text>

    <rect class="card" x="70" y="156" width="250" height="76" rx="10"/>
    <text class="h" x="195" y="176">Organization map</text>
    <text class="s" x="195" y="198">Products, customers, suppliers</text>
    <text class="s" x="195" y="216">and sites, key details only</text>

    <rect class="card" x="360" y="156" width="250" height="76" rx="10"/>
    <text class="h" x="485" y="176">Document library</text>
    <text class="s" x="485" y="198">Each linked to a product,</text>
    <text class="s" x="485" y="216">customer or supplier</text>

    <rect x="70" y="256" width="540" height="72" rx="10" fill="#FFFFFF" stroke="#7F77DD" stroke-width="1"/>
    <text class="h" x="340" y="280">Intelligent integration layer</text>
    <text class="s" x="340" y="304">Learns where and how to fetch information for your company</text>

    <rect x="40" y="380" width="600" height="130" rx="20" fill="#F1EFE8"/>
    <text class="h" x="340" y="488" style="fill:#444441">Your systems</text>

    <rect class="card" x="58" y="398" width="176" height="64" rx="10"/>
    <text class="h" x="146" y="420">Integration library</text>
    <text class="s" x="146" y="442">TraceGains, Manual Masters</text>
    <rect class="card" x="252" y="398" width="176" height="64" rx="10"/>
    <text class="h" x="340" y="420">Custom integrations</text>
    <text class="s" x="340" y="442">MS Fabric, Dynamics 365</text>
    <rect class="card" x="446" y="398" width="176" height="64" rx="10"/>
    <text class="h" x="534" y="420">DMS</text>
    <text class="s" x="534" y="442">SharePoint, Google Drive</text>

    <text class="s" x="340" y="536">Your systems stay the source of truth</text>
  </g>
  <g fill="none">
    <line x1="326" y1="194" x2="354" y2="194" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="3 3" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="195" y1="234" x2="195" y2="254" stroke="#7F77DD" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="485" y1="234" x2="485" y2="254" stroke="#7F77DD" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="320" y1="86" x2="252" y2="152" stroke="#D85A30" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="360" y1="86" x2="428" y2="152" stroke="#D85A30" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="146" y1="330" x2="146" y2="394" stroke="#888780" stroke-width="1" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="340" y1="330" x2="340" y2="394" stroke="#888780" stroke-width="1" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="534" y1="330" x2="534" y2="394" stroke="#888780" stroke-width="1" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <g dominant-baseline="central">
    <text class="s" x="154" y="365">Fetched live</text>
    <text class="s" x="348" y="365">Fetched live</text>
    <text class="s" x="542" y="365">Synced</text>
  </g>
</svg>
